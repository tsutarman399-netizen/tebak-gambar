<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Tebak Teman</title>

  <style>
#win-screen {
  display: none;

  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(0, 0, 0, 0.75);

  justify-content: center;
  align-items: center;
}

.win-box {
  background: white;
  padding: 30px;

  border-radius: 20px;

  text-align: center;

  width: 300px;
}

.win-box h2 {
  font-size: 32px;
  margin-bottom: 10px;
}

#restart-button {
  margin-top: 20px;

  padding: 12px 25px;

  font-size: 18px;
  font-weight: bold;

  border: none;
  border-radius: 10px;

  cursor: pointer;

  background: #222;
  color: white;
}
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin-top: 20px;
    }

    #game-board {
      width: 520px;
      max-width: 95%;
      margin: 20px auto;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;

      border: 2px solid #333;
      border-radius: 10px;

      overflow: hidden;

      background: #222;

      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <h1>Game Tebak Teman</h1>
  <p>Klik kartu untuk melihat fotonya.</p>

  <div id="game-board"></div>

<div id="win-screen">
  <div class="win-box">
    <h2>🎉 BANGSAT KAU!</h2>
    <p>Kamu berhasil mencocokkan semua foto.</p>

    <button id="restart-button">
      MAIN LAGI
    </button>
  </div>
</div>

  <script>

  const gameBoard = document.getElementById("game-board");

const winScreen = document.getElementById("win-screen");
const restartButton = document.getElementById("restart-button");

let remainingCards = 20;

const photos = [
  "foto1.jpg",
  "foto2.jpg",
  "foto3.jpg",
  "foto4.jpg",
  "foto5.jpg"
];

  let cards = [];

  photos.forEach(function(photo) {
    cards.push(photo);
    cards.push(photo);
    cards.push(photo);
    cards.push(photo);
  });

  cards.sort(function() {
    return Math.random() - 0.5;
  });

  let firstCard = null;
  let secondCard = null;
  let lockBoard = false;

  cards.forEach(function(photo) {

    const card = document.createElement("div");
    card.classList.add("card");

    const img = document.createElement("img");

    img.src = photo;
    img.style.display = "none";

    card.appendChild(img);

    card.addEventListener("click", function() {

      if (lockBoard) return;

      if (card === firstCard) return;

      img.style.display = "block";

      if (firstCard === null) {

        firstCard = card;
        return;

      }

      secondCard = card;

      const firstPhoto =
        firstCard.querySelector("img").src;

      const secondPhoto =
        secondCard.querySelector("img").src;

      if (firstPhoto === secondPhoto) {

        setTimeout(function() {

          firstCard.style.visibility = "hidden";
          secondCard.style.visibility = "hidden";

remainingCards = remainingCards - 2;

if (remainingCards === 0) {
  winScreen.style.display = "flex";
}

          firstCard = null;
          secondCard = null;

        }, 500);

      } else {

        lockBoard = true;

        setTimeout(function() {

          firstCard.querySelector("img").style.display = "none";

          secondCard.querySelector("img").style.display = "none";

          firstCard = null;
          secondCard = null;

          lockBoard = false;

        }, 800);

      }

    });

    gameBoard.appendChild(card);

  });

restartButton.addEventListener("click", function() {
  location.reload();
});
</script>

</body>
</html>
